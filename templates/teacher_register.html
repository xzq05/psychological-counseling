<!-- templates/teacher_register.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师注册 - 心理咨询预约系统</title>
    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .register-container {
            background: white;
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            position: relative;
        }
        .back-home {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        .back-home:hover {
            color: #43a047;
        }
        h2 {
            text-align: center;
            color: #43a047;
            margin-top: 10px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #333;
            font-weight: 500;
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #43a047;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #43a047;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background: #2e7d32;
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .footer-links {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #666;
        }
        .footer-links a {
            color: #43a047;
            text-decoration: none;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
        .success-msg {
            color: #2e7d32;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #fff3e0;
            color: #e65100;
        }
        .note {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        @media (max-width: 480px) {
            .register-container { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <a href="/" class="back-home">← 返回首页</a>

        <h2>👨‍🏫 教师注册</h2>
        <p class="subtitle">
            填写信息，提交审核
            <span class="status-badge">需管理员审核</span>
        </p>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>工号 *</label>
                <input type="text" id="username" placeholder="请输入工号" required>
            </div>
            <div class="form-group">
                <label>姓名 *</label>
                <input type="text" id="name" placeholder="请输入姓名" required>
            </div>
            <div class="form-group">
                <label>密码 *</label>
                <input type="password" id="password" placeholder="请设置密码（至少6位）" required minlength="6">
            </div>
            <div class="form-group">
                <label>手机号 *</label>
                <input type="tel" id="phone" placeholder="请输入手机号" required>
            </div>
            <div class="form-group">
                <label>职称 *</label>
                <input type="text" id="teacher_title" placeholder="如：高级心理咨询师" required>
            </div>
            <div class="form-group">
                <label>专业领域 *</label>
                <input type="text" id="teacher_specialty" placeholder="如：青少年心理、焦虑抑郁" required>
            </div>

            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>

            <button type="submit" class="btn-submit" id="submitBtn">提交注册</button>
        </form>

        <div class="note">
            ⏳ 注册后需要等待管理员审核通过才能登录
        </div>

        <div class="footer-links">
            <p>已有账号？<a href="/teacher/login">去登录</a></p>
            <p style="margin-top: 8px; font-size: 12px; color: #ccc;">
                <a href="/" style="color: #ccc;">返回首页</a>
            </p>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const form = document.getElementById('registerForm');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';

            const formData = new FormData(form);

            try {
                const response = await fetch('/api/auth/teacher/register', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successMsg.textContent = '✅ ' + (data.message || '注册成功！请等待管理员审核...');
                    successMsg.style.display = 'block';
                    form.reset();
                    submitBtn.textContent = '已提交';

                    setTimeout(() => {
                        window.location.href = '/teacher/login';
                    }, 3000);
                } else {
                    errorMsg.textContent = data.detail || data.message || '注册失败，请重试';
                    errorMsg.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '提交注册';
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请稍后重试';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = '提交注册';
            }
        }
    </script>
</body>
</html>
