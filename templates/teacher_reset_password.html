<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 · 心灵驿站</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="card" style="border-top: 4px solid var(--primary);">
            <div class="brand">
                <span class="brand-icon">🔐</span>
                <h1>重置密码</h1>
                <p>请设置新密码</p>
            </div>

            <div id="message" class="message"></div>

            <form id="resetForm" onsubmit="handleResetPassword(event)">
                <input type="hidden" id="token" value="{{ token }}">
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="newPassword" placeholder="请设置新密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-block">重置密码</button>
            </form>

            <div class="auth-link">
                <a href="/teacher/login">返回登录</a>
            </div>
        </div>
    </div>

    <script>
        async function handleResetPassword(e) {
            e.preventDefault();
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgDiv = document.getElementById('message');

            if (newPassword !== confirmPassword) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '两次输入的密码不一致';
                return;
            }

            const formData = new FormData();
            formData.append('token', token);
            formData.append('new_password', newPassword);

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ 密码重置成功！3秒后跳转到登录页面...';
                    setTimeout(() => {
                        window.location.href = '/teacher/login';
                    }, 3000);
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = data.detail || '重置失败';
                }
            } catch (error) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '网络错误，请稍后重试';
            }
        }
    </script>
</body>
</html>
