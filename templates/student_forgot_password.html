<!-- templates/student_forgot_password.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码 · 心灵驿站</title>
    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            position: relative;
        }
        .back-home {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        .back-home:hover {
            color: #1e88e5;
        }
        .brand {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand .icon {
            font-size: 48px;
            display: block;
        }
        .brand h1 {
            font-size: 24px;
            color: #333;
            margin: 8px 0 4px;
        }
        .brand p {
            color: #888;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #333;
            font-weight: 500;
            font-size: 13px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #1e88e5;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #1e88e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background: #1565c0;
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .message.error {
            background: #fce4ec;
            color: #c62828;
            display: block;
        }
        .temp-password-box {
            background: #f5f5f5;
            border: 2px dashed #1e88e5;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin: 15px 0;
            display: none;
        }
        .temp-password-box .label {
            font-size: 13px;
            color: #666;
        }
        .temp-password-box .password {
            font-size: 28px;
            font-weight: 700;
            color: #1e88e5;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
        }
        .auth-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
        .auth-link a {
            color: #1e88e5;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .container { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-home">← 返回首页</a>

        <div class="brand">
            <span class="icon">🔑</span>
            <h1>找回密码</h1>
            <p>验证身份后生成临时密码</p>
        </div>

        <div id="message" class="message"></div>

        <form id="resetForm" onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label>学号</label>
                <input type="text" id="username" placeholder="请输入学号" required>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" id="phone" placeholder="请输入绑定的手机号" required>
            </div>
            <div class="form-group">
                <label>性别</label>
                <select id="gender" required>
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
            <div class="form-group">
                <label>班级</label>
                <input type="text" id="class_name" placeholder="请输入班级（如：高三(1)班）" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">验证并生成临时密码</button>
        </form>

        <div id="tempPasswordBox" class="temp-password-box">
            <div class="label">🔐 临时密码（请妥善保管）</div>
            <div class="password" id="tempPassword">123456</div>
            <p style="font-size: 12px; color: #999; margin-top: 8px;">
                ⚠️ 请使用此密码登录后立即修改
            </p>
        </div>

        <div class="auth-link">
            <a href="/student/login">返回登录</a>
        </div>
    </div>

    <script>
        async function handleForgotPassword(e) {
            e.preventDefault();

            const msgDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const tempBox = document.getElementById('tempPasswordBox');
            const tempPass = document.getElementById('tempPassword');

            msgDiv.className = 'message';
            msgDiv.style.display = 'none';
            tempBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = '验证中...';

            const data = {
                username: document.getElementById('username').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                gender: document.getElementById('gender').value,
                class_name: document.getElementById('class_name').value.trim()
            };

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ 身份验证通过！';
                    msgDiv.style.display = 'block';

                    tempPass.textContent = result.temp_password;
                    tempBox.style.display = 'block';

                    submitBtn.textContent = '已生成';
                    submitBtn.disabled = true;

                    setTimeout(() => {
                        submitBtn.textContent = '重新生成';
                        submitBtn.disabled = false;
                    }, 3000);
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = result.detail || '验证失败，请检查信息是否正确';
                    msgDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '验证并生成临时密码';
                }
            } catch (error) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '网络错误，请稍后重试';
                msgDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = '验证并生成临时密码';
            }
        }
    </script>
</body>
</html>
