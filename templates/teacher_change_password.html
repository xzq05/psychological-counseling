<!-- templates/teacher_change_password.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · 心灵驿站</title>
    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            position: relative;
        }
        .back-home {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
        }
        .back-home:hover {
            color: #43a047;
        }
        .brand {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand .icon {
            font-size: 48px;
            display: block;
        }
        .brand h1 {
            font-size: 24px;
            color: #333;
            margin: 8px 0 4px;
        }
        .brand p {
            color: #888;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: #333;
            font-weight: 500;
            font-size: 13px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: #43a047;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #43a047;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background: #2e7d32;
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 14px;
        }
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .message.error {
            background: #fce4ec;
            color: #c62828;
            display: block;
        }
        .auth-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
        .auth-link a {
            color: #43a047;
            text-decoration: none;
        }
        .auth-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .container { padding: 25px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/teacher" class="back-home">← 返回仪表板</a>

        <div class="brand">
            <span class="icon">🔐</span>
            <h1>修改密码</h1>
            <p>为了账户安全，请定期修改密码</p>
        </div>

        <div id="message" class="message"></div>

        <form id="changeForm" onsubmit="handleChangePassword(event)">
            <div class="form-group">
                <label>当前密码</label>
                <input type="password" id="oldPassword" placeholder="请输入当前密码" required>
            </div>
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="newPassword" placeholder="请设置新密码（至少6位）" required minlength="6">
            </div>
            <div class="form-group">
                <label>确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required minlength="6">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">修改密码</button>
        </form>

        <div class="auth-link">
            <a href="/teacher">返回仪表板</a>
        </div>
    </div>

    <script>
        async function handleChangePassword(e) {
            e.preventDefault();

            const oldPassword = document.getElementById('oldPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();
            const msgDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            msgDiv.className = 'message';
            msgDiv.style.display = 'none';

            if (newPassword !== confirmPassword) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '两次输入的密码不一致';
                msgDiv.style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '密码长度不能少于6位';
                msgDiv.style.display = 'block';
                return;
            }

            const username = localStorage.getItem('username') || '';
            if (!username) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '请先登录';
                msgDiv.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '修改中...';

            try {
                const response = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        old_password: oldPassword,
                        new_password: newPassword
                    })
                });

                const result = await response.json();

                if (result.success) {
                    msgDiv.className = 'message success';
                    msgDiv.textContent = '✅ ' + result.message;
                    msgDiv.style.display = 'block';
                    document.getElementById('changeForm').reset();
                    submitBtn.textContent = '已修改';
                    submitBtn.disabled = true;

                    setTimeout(() => {
                        window.location.href = '/teacher';
                    }, 2000);
                } else {
                    msgDiv.className = 'message error';
                    msgDiv.textContent = result.detail || '修改失败，请重试';
                    msgDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = '修改密码';
                }
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = '网络错误，请稍后重试';
                msgDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = '修改密码';
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const username = localStorage.getItem('username') || localStorage.getItem('user_name') || '';
            if (!username) {
                window.location.href = '/teacher/login';
            }
        });
    </script>
</body>
</html>
